name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r backend/requirements-dev.txt pypdf

      - name: Créer la base de données
        run: |
          mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < db/01_schema.sql
          mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < db/02_seed.sql

      - name: Lancer les tests
        working-directory: backend
        run: python -m pytest -q
